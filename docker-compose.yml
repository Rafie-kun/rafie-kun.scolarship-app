services:
  scholarpath_db:
    image: postgres:16-alpine
    container_name: scholarpath_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholarpath
    ports:
      - "5432:5432"
    volumes:
      - scholarpath_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  scholarpath:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarpath_ecosystem
    ports:
      - "3000:3000"
    depends_on:
      scholarpath_db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@scholarpath_db:5432/scholarpath?pgbouncer=true
      - DATABASE_URL_UNPOOLED=postgresql://postgres:postgres@scholarpath_db:5432/scholarpath
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  scholarpath_db_data:
