[package]
name = "scholarpath"
version = "4.0.0"
description = "ScholarPath — Scholarship, University & Internship Finder (Beta)"
authors = ["Rafie Kun"]
license = "MIT"
repository = "https://github.com/Rafie-kun/rafie-kun.scolarship-app"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
