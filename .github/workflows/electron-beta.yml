name: Electron Beta — Desktop App (JS only, no Rust)

permissions:
  contents: write

on:
  push:
    tags: ['beta-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            pattern: '*.exe'
          - os: ubuntu-22.04
            args: --linux AppImage deb
            pattern: '*.{AppImage,deb}'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build Electron (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: List built files
        run: |
          echo "=== dist ==="; Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          echo "=== release ==="; Get-ChildItem -Recurse release -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          echo "=== out ==="; Get-ChildItem -Recurse out -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
        shell: pwsh
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*${{ matrix.pattern }}
            release/**/*${{ matrix.pattern }}
            out/**/*${{ matrix.pattern }}
            **/ScholarPath*${{ matrix.pattern }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
