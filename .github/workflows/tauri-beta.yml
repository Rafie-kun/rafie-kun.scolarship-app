name: Tauri Beta — Desktop App

on:
  push:
    branches: [beta/desktop-app]
    tags: ['beta-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend deps
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundles (branch, no release)
        if: github.ref_type == 'branch'
        run: npx tauri build --debug

      - name: Tauri build + Release (tag)
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ScholarPath Beta ${{ github.ref_name }}"
          releaseBody: |
            **ScholarPath Beta — Desktop App (Windows .exe + Linux AppImage/.deb + Flatpak)**

            Works exactly like the website, with an extra **Settings** tab for your Gemini API key.

            - Install Windows: download `ScholarPath_*_x64-setup.exe` (NSIS — choose install location)
            - Install Linux AppImage: download `ScholarPath_*_amd64.AppImage` (`chmod +x` and run)
            - Install Linux deb: `sudo dpkg -i ScholarPath_*_amd64.deb`
            - Install Linux Flatpak: `flatpak install ScholarPath-beta.flatpak` (or via `flatpak-builder`)
            - Settings → paste your Gemini API key (or any provider key) — stored locally, never sent to our servers except for AI calls. Get a key at https://aistudio.google.com/app/apikey

            Auto-updates when you pull the beta branch; for a fresh install just run the installer again (allows downgrades).
          releaseDraft: true
          prerelease: true

      - name: Build Flatpak (Ubuntu tag only)
        if: github.ref_type == 'tag' && matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Bundle the already-built Tauri binary into a Flatpak
          mkdir -p flatpak/build
          cp src-tauri/target/release/bundle/deb/*.deb flatpak/ 2>/dev/null || echo "No deb yet, using AppImage binary"
          cp src-tauri/target/release/scholarpath flatpak/scholarpath 2>/dev/null || cp src-tauri/target/release/bundle/appimage/*.AppImage flatpak/scholarpath 2>/dev/null || echo "Binary not found, Flatpak will use AppImage"
          cp public/favicon.svg flatpak/icon.png 2>/dev/null || cp src-tauri/icons/icon.png flatpak/icon.png
          flatpak-builder --force-clean --ccache --repo=flatpak/repo flatpak/build flatpak/com.rafiekun.scholarpath.beta.yml || echo "Flatpak build failed, check manifest"
          flatpak build-bundle flatpak/repo ScholarPath-beta.flatpak com.rafiekun.scholarpath.beta 2>/dev/null || echo "Flatpak bundle failed"
          ls -lh flatpak/*.flatpak 2>/dev/null || echo "No flatpak bundle produced"
