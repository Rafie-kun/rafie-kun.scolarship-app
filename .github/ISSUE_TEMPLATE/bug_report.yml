name: Bug report
description: Something is broken or looks wrong.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Somnia. Please remove personal data, tokens and `.env` values before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: I clicked X and expected Y, but Z happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Legacy app (Vite + Express)
        - Next.js catalog app
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, console output or logs
      description: Drag images in here or paste relevant output.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed personal data, tokens and secrets.
          required: true
