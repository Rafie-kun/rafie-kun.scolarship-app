<!DOCTYPE html>
<html lang="en" class="theme-mode-omori">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somnia - A quiet workspace for scholarships, universities & study abroad</title>
    <meta name="description" content="Somnia is a calm, offline-friendly workspace that helps international students find scholarships, compare universities, plan budgets, prepare visas, and track applications." />
    <meta name="theme-color" content="#08070d" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Somnia" />
    <meta property="og:title" content="Somnia - A quiet workspace for your study-abroad journey" />

    <meta property="og:image" content="./favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Somnia - A quiet workspace for your study-abroad journey" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..800;1,400..700&family=Pixelify+Sans:wght@400..700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" />
